[project]
name = "zgiis-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "pyrtcm>=1.0.0",
    "psycopg2-binary>=2.9.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "requests>=2.31.0",
    "anthropic>=0.25.0",
]

[tool.vercel]
# Root main.py is also a Vercel default FastAPI location (avoids
# FASTAPI_ENTRYPOINT_NOT_FOUND when the project Framework Preset is FastAPI).
entrypoint = "main:app"

[tool.vercel.scripts]
build = "python scripts/vercel_build.py"
